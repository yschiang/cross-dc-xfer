server:
  port: 8080
spring:
  application:
    name: gigaxfer-sync
  flyway:
    enabled: false          # migration 由 DbBootstrap 在背景重試執行（D34 修）
  datasource:
    hikari:
      initialization-fail-timeout: -1   # DB 不可用時不阻擋啟動
      maximum-pool-size: 8
      connection-init-sql: ALTER SESSION SET TIME_ZONE = 'UTC'   # 每個 DB session 以 UTC 為準（D58 ⑦，Oracle 語法）
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,nfs
  health:
    db:
      enabled: false   # 關掉 Boot 內建 DataSource indicator：migration 未完成時它也回 UP，語意不對；自訂 db 取代
  metrics:
    tags:
      node: ${gigaxfer.node}
gigaxfer:
  nfs-timeout: 30s
  nfs-slots: 16
